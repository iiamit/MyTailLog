# Firebase App Hosting backend configuration (provisions a Cloud Run service).
# Safe to commit: real secret values live in Cloud Secret Manager and are only
# referenced by name here. See README "Deploy (Firebase App Hosting + Supabase)".

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0 # scale to zero when idle → ~no cost between visits
  maxInstances: 2 # cap to bound cost (Blaze has no hard spend limit)
  concurrency: 80

env:
  # Public Supabase config — needed at BUILD (baked into the client bundle) and
  # at RUNTIME. Held as secrets so nothing real lands in a public repo.
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: NEXT_PUBLIC_SUPABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  # Server-only — never exposed to the browser.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Server-only — the daily reminder/sync cron. NEVER exposed to the browser.
  # SUPABASE_SECRET_KEY is a Supabase *secret API key* (sb_secret_...), created
  # under Project Settings → API Keys → "Create secret key" — the recommended,
  # individually-revocable replacement for the legacy service_role JWT. It
  # bypasses RLS, so it is used ONLY by src/app/api/cron/daily.
  - variable: SUPABASE_SECRET_KEY
    secret: SUPABASE_SECRET_KEY
    availability:
      - RUNTIME
  # Resend API key for outbound reminder emails.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  # Shared bearer secret gating POST /api/cron/daily (Cloud Scheduler sends it).
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  # OpenSky Network OAuth2 client credentials for the ADS-B passive-hours sweep
  # (opensky-network.org → Account → API client). Server-only; the sweep sends
  # nothing but a public Mode S hex. Absent → the sweep logs and skips, so the
  # rest of the cron is unaffected. /flights/* is 4,000 credits/day and the
  # sweep's 3-UTC-day lookback costs 8 per aircraft (two legal 2-partition
  # requests), so this ceilings at ~500 opted-in aircraft/day.
  # NOTE: these two Secret Manager entries are lower-kebab, unlike the rest of
  # the file. That is the name they were actually created under — the `secret:`
  # key must match the Secret Manager ID exactly, so don't "fix" the casing
  # without renaming the secret first.
  - variable: OPENSKY_CLIENT_ID
    secret: opensky-client-id
    availability:
      - RUNTIME
  - variable: OPENSKY_CLIENT_SECRET
    secret: opensky-client-secret
    availability:
      - RUNTIME
  # Dropbox app credentials for scheduled cloud backups (dropbox.com/developers
  # → an app with "App folder" access and the files.content.write scope).
  # Server-only; the OAuth tokens they mint are encrypted at rest and live in the
  # private schema (0049). Absent → the backup sweep logs one line and skips and
  # the Profile card says it isn't configured, so the rest of the app is
  # unaffected.
  #
  # NOT YET PROVISIONED. Create them with EXACTLY these Secret Manager IDs:
  #   firebase apphosting:secrets:set DROPBOX_CLIENT_ID
  #   firebase apphosting:secrets:set DROPBOX_CLIENT_SECRET
  # The `secret:` key must match the Secret Manager ID character for character —
  # PR #131 was a deploy that failed purely because it didn't (see the OPENSKY_*
  # note above).
  - variable: DROPBOX_CLIENT_ID
    secret: DROPBOX_CLIENT_ID
    availability:
      - RUNTIME
  - variable: DROPBOX_CLIENT_SECRET
    secret: DROPBOX_CLIENT_SECRET
    availability:
      - RUNTIME
  # Google Drive OAuth client for scheduled cloud backups (Google Cloud Console
  # → APIs & Services → Credentials → OAuth client ID → Web application), with
  # the Drive API enabled and the authorised redirect URI
  # https://mytaillog.com/api/backup/gdrive/callback.
  #
  # ⚠️ THE OAUTH APP MUST BE PUBLISHED TO "IN PRODUCTION", NOT LEFT IN "TESTING".
  # An app in Testing publishing status issues refresh tokens that EXPIRE AFTER
  # 7 DAYS. A backup that runs monthly therefore finds a dead token on every
  # single run, and it fails SILENTLY — the exact "I thought I had a backup"
  # outcome this feature exists to prevent. Publishing is a functional
  # prerequisite, not paperwork.
  #
  # We request ONLY https://www.googleapis.com/auth/drive.file, which is
  # NON-SENSITIVE: no security assessment, no CASA, and it grants access solely
  # to files our app created. Do not widen it — `drive` / `drive.readonly` are
  # sensitive or restricted and would drag in an assessment.
  #
  # (Dropbox is NOT like this: its development status is fine indefinitely.
  # See docs/plan-cloud-backups.md §3.)
  #
  # Server-only; the tokens they mint are encrypted at rest in the private
  # schema (0049/0050). Absent → the sweep logs one line and skips Google Drive
  # destinations only, and the Profile card says it isn't configured.
  #
  # NOT YET PROVISIONED. Create them with EXACTLY these Secret Manager IDs:
  #   firebase apphosting:secrets:set GOOGLE_DRIVE_CLIENT_ID
  #   firebase apphosting:secrets:set GOOGLE_DRIVE_CLIENT_SECRET
  # The `secret:` key must match the Secret Manager ID character for character —
  # PR #131 was a deploy that failed purely because it didn't (see the OPENSKY_*
  # note above).
  - variable: GOOGLE_DRIVE_CLIENT_ID
    secret: GOOGLE_DRIVE_CLIENT_ID
    availability:
      - RUNTIME
  - variable: GOOGLE_DRIVE_CLIENT_SECRET
    secret: GOOGLE_DRIVE_CLIENT_SECRET
    availability:
      - RUNTIME
  # Server-only. Encrypts MyFlightBook secrets/tokens and users' own Anthropic
  # keys at rest (AES-256-GCM, src/lib/crypto.ts). Any non-empty string works
  # (SHA-256'd to a 32-byte key); rotating it makes existing ciphertext
  # undecryptable, so users would re-enter those secrets. Create with:
  #   firebase apphosting:secrets:set ENCRYPTION_KEY   (paste `openssl rand -base64 32`)
  # Local dev shares the same Supabase DB, so use the SAME value in .env.local.
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  # Server-only. RS256 signing keys (a JWKS JSON) for the OAuth Authorization
  # Server — signs access/ID tokens and is published at /api/oidc/jwks. Generate
  # once and keep stable (rotating invalidates issued tokens):
  #   node scripts/gen-oidc-jwks.mjs | firebase apphosting:secrets:set OIDC_JWKS --data-file -
  # Without it, /api/oidc/* returns 503 but the rest of the app is unaffected.
  # (OAuth session cookies are signed with ENCRYPTION_KEY unless OIDC_COOKIE_SECRET is set.)
  - variable: OIDC_JWKS
    secret: OIDC_JWKS
    availability:
      - RUNTIME

  # Non-sensitive defaults.
  - variable: EXTRACTION_MODEL # vision / handwriting (keep strong)
    value: claude-opus-4-8
    availability:
      - RUNTIME
  - variable: TEXT_MODEL # text-only tasks: Q&A, equipment/maintenance detection
    value: claude-haiku-4-5
    availability:
      - RUNTIME
  # AI usage limits (tune the number + redeploy — no code change). Per-user/day
  # call caps for the shared vs a user's own key, and the GLOBAL daily $ ceiling
  # on the shared key across all users (0 disables it). See src/lib/extraction/aiContext.ts.
  - variable: AI_SHARED_USER_DAILY_CALLS
    value: "100"
    availability:
      - RUNTIME
  - variable: AI_OWN_USER_DAILY_CALLS
    value: "1000"
    availability:
      - RUNTIME
  - variable: AI_SHARED_DAILY_USD
    value: "20"
    availability:
      - RUNTIME
  # Scheduled-backup size ceiling in bytes (default 400 MB). Above this the run
  # is recorded as skipped_too_large and the user is told, instead of timing out
  # against the cron's 300 s limit at 3am. Tune the number + redeploy once the
  # phase-1 telemetry shows the real archive size distribution.
  - variable: BACKUP_MAX_BYTES
    value: "419430400"
    availability:
      - RUNTIME
  - variable: LOGBOOK_STORAGE_BUCKET
    value: logbook-pages
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_LOGBOOK_STORAGE_BUCKET
    value: logbook-pages
    availability:
      - BUILD
      - RUNTIME
  # GCS bucket for blob storage. Only read when STORAGE_BACKEND=gcs; harmless to
  # set ahead of the cutover. No key file — the App Hosting service account
  # authenticates to GCS via Application Default Credentials (grant it
  # roles/storage.objectAdmin on the bucket).
  - variable: GCS_BUCKET
    value: mytaillog-blobs
    availability:
      - RUNTIME
  # Storage backend switch: "supabase" (default) or "gcs". Now on GCS — all 2071
  # existing objects were copied over (migrate-storage-to-gcs.mjs) and the runtime
  # SA passed /api/admin/storage-check. Rollback = set back to "supabase" (the DB
  # points at the same keys on both). See src/lib/storage.ts.
  - variable: STORAGE_BACKEND
    value: gcs
    availability:
      - RUNTIME
  # Canonical public origin. publicOrigin() pins redirects / OAuth redirect_uri
  # to this instead of reflecting a client-supplied Host header (anti-poisoning).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://mytaillog.com
    availability:
      - BUILD
      - RUNTIME
