# Firebase App Hosting backend configuration (provisions a Cloud Run service).
# Safe to commit: real secret values live in Cloud Secret Manager and are only
# referenced by name here. See README "Deploy (Firebase App Hosting + Supabase)".

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0 # scale to zero when idle → ~no cost between visits
  maxInstances: 2 # cap to bound cost (Blaze has no hard spend limit)
  concurrency: 80

env:
  # Public Supabase config — needed at BUILD (baked into the client bundle) and
  # at RUNTIME. Held as secrets so nothing real lands in a public repo.
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: NEXT_PUBLIC_SUPABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability:
      - BUILD
      - RUNTIME

  # Server-only — never exposed to the browser.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Server-only — the daily reminder/sync cron. NEVER exposed to the browser.
  # SUPABASE_SECRET_KEY is a Supabase *secret API key* (sb_secret_...), created
  # under Project Settings → API Keys → "Create secret key" — the recommended,
  # individually-revocable replacement for the legacy service_role JWT. It
  # bypasses RLS, so it is used ONLY by src/app/api/cron/daily.
  - variable: SUPABASE_SECRET_KEY
    secret: SUPABASE_SECRET_KEY
    availability:
      - RUNTIME
  # Resend API key for outbound reminder emails.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  # Shared bearer secret gating POST /api/cron/daily (Cloud Scheduler sends it).
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  # OpenSky Network OAuth2 client credentials for the ADS-B passive-hours sweep
  # (opensky-network.org → Account → API client). Server-only; the sweep sends
  # nothing but a public Mode S hex. Absent → the sweep logs and skips, so the
  # rest of the cron is unaffected. /flights/* is 4,000 credits/day and one
  # aircraft costs 4, so this ceilings at ~1,000 opted-in aircraft/day.
  - variable: OPENSKY_CLIENT_ID
    secret: OPENSKY_CLIENT_ID
    availability:
      - RUNTIME
  - variable: OPENSKY_CLIENT_SECRET
    secret: OPENSKY_CLIENT_SECRET
    availability:
      - RUNTIME
  # Server-only. Encrypts MyFlightBook secrets/tokens and users' own Anthropic
  # keys at rest (AES-256-GCM, src/lib/crypto.ts). Any non-empty string works
  # (SHA-256'd to a 32-byte key); rotating it makes existing ciphertext
  # undecryptable, so users would re-enter those secrets. Create with:
  #   firebase apphosting:secrets:set ENCRYPTION_KEY   (paste `openssl rand -base64 32`)
  # Local dev shares the same Supabase DB, so use the SAME value in .env.local.
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  # Server-only. RS256 signing keys (a JWKS JSON) for the OAuth Authorization
  # Server — signs access/ID tokens and is published at /api/oidc/jwks. Generate
  # once and keep stable (rotating invalidates issued tokens):
  #   node scripts/gen-oidc-jwks.mjs | firebase apphosting:secrets:set OIDC_JWKS --data-file -
  # Without it, /api/oidc/* returns 503 but the rest of the app is unaffected.
  # (OAuth session cookies are signed with ENCRYPTION_KEY unless OIDC_COOKIE_SECRET is set.)
  - variable: OIDC_JWKS
    secret: OIDC_JWKS
    availability:
      - RUNTIME

  # Non-sensitive defaults.
  - variable: EXTRACTION_MODEL # vision / handwriting (keep strong)
    value: claude-opus-4-8
    availability:
      - RUNTIME
  - variable: TEXT_MODEL # text-only tasks: Q&A, equipment/maintenance detection
    value: claude-haiku-4-5
    availability:
      - RUNTIME
  # AI usage limits (tune the number + redeploy — no code change). Per-user/day
  # call caps for the shared vs a user's own key, and the GLOBAL daily $ ceiling
  # on the shared key across all users (0 disables it). See src/lib/extraction/aiContext.ts.
  - variable: AI_SHARED_USER_DAILY_CALLS
    value: "100"
    availability:
      - RUNTIME
  - variable: AI_OWN_USER_DAILY_CALLS
    value: "1000"
    availability:
      - RUNTIME
  - variable: AI_SHARED_DAILY_USD
    value: "20"
    availability:
      - RUNTIME
  - variable: LOGBOOK_STORAGE_BUCKET
    value: logbook-pages
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_LOGBOOK_STORAGE_BUCKET
    value: logbook-pages
    availability:
      - BUILD
      - RUNTIME
  # GCS bucket for blob storage. Only read when STORAGE_BACKEND=gcs; harmless to
  # set ahead of the cutover. No key file — the App Hosting service account
  # authenticates to GCS via Application Default Credentials (grant it
  # roles/storage.objectAdmin on the bucket).
  - variable: GCS_BUCKET
    value: mytaillog-blobs
    availability:
      - RUNTIME
  # Storage backend switch: "supabase" (default) or "gcs". Now on GCS — all 2071
  # existing objects were copied over (migrate-storage-to-gcs.mjs) and the runtime
  # SA passed /api/admin/storage-check. Rollback = set back to "supabase" (the DB
  # points at the same keys on both). See src/lib/storage.ts.
  - variable: STORAGE_BACKEND
    value: gcs
    availability:
      - RUNTIME
  # Canonical public origin. publicOrigin() pins redirects / OAuth redirect_uri
  # to this instead of reflecting a client-supplied Host header (anti-poisoning).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://mytaillog.com
    availability:
      - BUILD
      - RUNTIME
