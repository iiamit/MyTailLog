<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon source. iOS masks the corners, so this is a full-bleed square with
       no transparency. Run `npx capacitor-assets generate --ios` to produce the
       AppIcon set, then `npx cap sync ios`. -->
  <rect width="1024" height="1024" fill="#0b0f16"/>
  <defs>
    <linearGradient id="mark" x1="238" y1="296" x2="786" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="1" stop-color="#8ec8ff"/>
    </linearGradient>
  </defs>
  <path d="M512 300 L788 726 L236 726 Z" fill="url(#mark)"/>
</svg>
