# Supabase local development config. `supabase start` uses these; production
# settings live in the hosted project dashboard. Project ref is set via
# `supabase link --project-ref <ref>`.
project_id = "mytaillog"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public", "storage"]

[studio]
port = 54323

[auth]
enable_signup = true
enable_manual_linking = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback**", "com.mytaillog.app://auth/callback"]

[storage]
# Logbook page images can be large phone photos; allow generous per-file size.
file_size_limit = "25MiB"
