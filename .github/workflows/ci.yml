name: CI

# The enforcement layer: a test suite only prevents regressions if it runs on
# every change. Typecheck + lint + tests + build gate every PR and push to main.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: every step here only reads the repo.
# Without this the workflow inherits the repository default, which can be
# read/write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public build-time values only — dummies so the build resolves; no
          # secrets needed (nothing calls Supabase/Anthropic at build time).
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
