name: CI

# The enforcement layer: a test suite only prevents regressions if it runs on
# every change. Typecheck + lint + tests + build gate every PR and push to main.
on:
  pull_request:
  push:
    branches: [main, "redesign/**"]
  schedule:
    - cron: "41 7 * * 0"
  workflow_dispatch:
  release:
    types: [published]

# Least privilege for GITHUB_TOKEN: every step here only reads the repo.
# Without this the workflow inherits the repository default, which can be
# read/write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# Keep production-commit checks; only superseded PR commits are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.native.outputs.android }}
      apple: ${{ steps.native.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/test-ci-native-changes.py
      - name: Select native checks
        id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Schedules, releases, manual runs and new branches get complete coverage.
          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != push ]] ||
             [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'android=true\napple=true\n' >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" -- |
              python3 scripts/ci-native-changes.py >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Require successful change detection
        working-directory: .
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      # Generated design tokens (CSS, Swift, Kotlin) must match tokens.json.
      - run: node ../../packages/shared/scripts/build-tokens.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Public build-time values only — dummies so the build resolves; no
          # secrets needed (nothing calls Supabase/Anthropic at build time).
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      - run: npm ci --prefix ../mobile
      - run: npm run typecheck --prefix ../mobile
      - run: npm run build --prefix ../mobile

  database-transactions:
    # pgserver ships Python 3.12 wheels; keep the disposable DB runner explicit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disposable database test tools
        run: |
          python3.12 -m venv "$RUNNER_TEMP/mtl-database-tests"
          "$RUNNER_TEMP/mtl-database-tests/bin/pip" install pgserver==0.1.4 'psycopg[binary]==3.3.9'
      - name: RLS, concurrent commits, rollback and replay receipts
        run: |
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-audit-database.py
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-audit-record-commands.py
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-audit-sync-receipts.py
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-audit-review-versions.py
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-audit-compliance.py
          "$RUNNER_TEMP/mtl-database-tests/bin/python" scripts/test-owner-workspace.py

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Library compilation does not execute its tests; include each shared host suite explicitly.
      - run: >-
          ./gradlew --console=plain :app:testDebugUnitTest :core-design:testDebugUnitTest :app:assembleDebug
          :core:domain:testAndroidHostTest :core:api:testAndroidHostTest
          :core:db:testAndroidHostTest :core:sync:testAndroidHostTest

  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Identify the native compiler toolchain
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ steps.xcode.outputs.version }}-${{ hashFiles('apps/core/gradle/**', 'apps/core/gradle.properties', 'apps/core/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-${{ steps.xcode.outputs.version }}-
      - name: Shared iOS tests and simulator framework
        working-directory: apps/core
        run: >-
          ./gradlew --console=plain :domain:iosSimulatorArm64Test :api:iosSimulatorArm64Test
          :db:iosSimulatorArm64Test :sync:iosSimulatorArm64Test
          :framework:linkDebugFrameworkIosSimulatorArm64
      - name: Release framework verification
        if: github.event_name != 'pull_request'
        working-directory: apps/core
        run: ./gradlew --console=plain :framework:assembleMyTailLogCoreReleaseXCFramework
      - name: iOS tests
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate --spec project-ci.yml
          # Runner images change their simulator set; use the first available iPhone.
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild test -scheme MyTailLog -destination "platform=iOS Simulator,name=$SIM"
