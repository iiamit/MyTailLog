name: E2E

# Runs on every PR, nightly, and on demand. Needs the TEST_* repo secrets + a
# reachable test Supabase project (the preflight fails fast if either is off).
# Fork PRs won't have secrets — this is a single-owner repo, so that's moot.
# See docs/e2e-regression-plan.md.
on:
  pull_request:
  schedule:
    - cron: "23 7 * * *" # nightly ~07:23 UTC (off-peak minute)
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Preflight — verify the TEST Supabase env before spending a browser run
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          fail=0
          for v in TEST_SUPABASE_URL TEST_SUPABASE_ANON_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing/empty"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          case "$TEST_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::TEST_SUPABASE_URL must be https://<ref>.supabase.co (got a different shape)"; exit 1;;
          esac
          code=$(curl -s -o /tmp/h -w '%{http_code}' -H "apikey: $TEST_SUPABASE_ANON_KEY" "$TEST_SUPABASE_URL/auth/v1/health" || echo 000)
          echo "auth/v1/health -> HTTP $code"; head -c 200 /tmp/h; echo
          grep -qi "GoTrue" /tmp/h || { echo "::error::$TEST_SUPABASE_URL/auth/v1/health is not a live Supabase auth API (got HTML/other). Check the URL + anon key point at the TEST project."; exit 1; }
          # Actually log the TEST user in — the browser suite can't authenticate if
          # this fails, and "Invalid login credentials" here means the URL, anon key,
          # and user aren't all the same project. jq builds the body so a special
          # char in the password can't mangle the JSON. Only the error body (never
          # the token) is printed.
          body=$(jq -n --arg e "$TEST_USER_EMAIL" --arg p "$TEST_USER_PASSWORD" '{email:$e,password:$p}')
          lcode=$(curl -s -o /tmp/login -w '%{http_code}' -X POST "$TEST_SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $TEST_SUPABASE_ANON_KEY" -H "Content-Type: application/json" --data "$body" || echo 000)
          grep -q access_token /tmp/login || { echo "::error::TEST user login failed (HTTP $lcode) against $TEST_SUPABASE_URL — TEST_USER_EMAIL/TEST_USER_PASSWORD don't match a confirmed account in THIS project. The URL, anon key, and user must all be the same Supabase project. Response: $(head -c 200 /tmp/login)"; exit 1; }
          echo "login preflight -> HTTP $lcode, TEST user authenticates"
      - run: npm run e2e
        env:
          CI: "true"
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
