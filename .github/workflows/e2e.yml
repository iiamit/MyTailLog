name: E2E

# Runs on every PR, nightly, and on demand. Needs the TEST_* repo secrets + a
# reachable test Supabase project (the preflight fails fast if either is off).
# Fork PRs won't have secrets — this is a single-owner repo, so that's moot.
# See docs/e2e-regression-plan.md.
on:
  pull_request:
  schedule:
    - cron: "23 7 * * *" # nightly ~07:23 UTC (off-peak minute)
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Preflight — verify the TEST Supabase env before spending a browser run
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          fail=0
          for v in TEST_SUPABASE_URL TEST_SUPABASE_ANON_KEY TEST_USER_EMAIL TEST_USER_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing/empty"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          case "$TEST_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::TEST_SUPABASE_URL must be https://<ref>.supabase.co (got a different shape)"; exit 1;;
          esac
          code=$(curl -s -o /tmp/h -w '%{http_code}' -H "apikey: $TEST_SUPABASE_ANON_KEY" "$TEST_SUPABASE_URL/auth/v1/health" || echo 000)
          echo "auth/v1/health -> HTTP $code"; head -c 200 /tmp/h; echo
          grep -qi "GoTrue" /tmp/h || { echo "::error::$TEST_SUPABASE_URL/auth/v1/health is not a live Supabase auth API (got HTML/other). Check the URL + anon key point at the TEST project."; exit 1; }
      - run: npm run e2e
        env:
          CI: "true"
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
