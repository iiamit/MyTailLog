name: Semgrep

# Static analysis on every PR + push to main, plus weekly (catches newly
# published rules against unchanged code). Mirrors the local
# `semgrep scan --config auto` and blocks the PR on any finding (--error).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1" # Mondays ~07:27 UTC
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error --disable-version-check
