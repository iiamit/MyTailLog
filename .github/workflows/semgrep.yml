name: Semgrep

# Static analysis on every PR + push to main, plus weekly (catches newly
# published rules against unchanged code). Mirrors the local
# `semgrep scan --config auto` and blocks the PR on any finding (--error).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 7 * * 1" # Mondays ~07:27 UTC
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: every step here only reads the repo.
# Without this the workflow inherits the repository default, which can be
# read/write (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep
      - run: semgrep scan --config auto --error --disable-version-check
