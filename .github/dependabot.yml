version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (they can't self-update once pinned).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm deps. Group minor/patch into one weekly PR to keep the noise down;
  # majors come as individual PRs so they get a proper look.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
